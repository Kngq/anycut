# Builds anycut for macOS (Apple Silicon + Intel), Windows and Linux, and publishes the installers
# as a GitHub Release. Run it by pushing a version tag:
#
#   npm version patch        # bumps package.json and creates the tag, e.g. v0.1.1
#   git push --follow-tags
#
# or from the Actions tab ("Run workflow"), which builds and publishes the current package.json
# version. Installer file names are fixed, so README links to releases/latest/download/<file>
# always point at the newest build.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: --mac --arm64
          - os: macos-15-intel
            args: --mac --x64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-22.04
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # onnxruntime-node's installer otherwise fetches a CUDA build on Linux (404s; anycut runs
          # it on the CPU).
          npm_config_onnxruntime_node_install_cuda: skip
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: anycut-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          name: anycut ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist-release/*
